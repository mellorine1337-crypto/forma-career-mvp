<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ответы — Forma</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/admin">form<i>a</i></a><span class="pill">Ответы</span></header><main class="shell"><a class="back" href="/admin">← Все формы</a><div class="hero"><div><div class="eyebrow">Полученные отклики</div><h1 id="title">Загрузка…</h1><p class="sub" id="count"></p></div><button class="btn secondary" id="csv">Скачать CSV</button></div><div class="responses" id="responses"></div></main><script>const id=new URLSearchParams(location.search).get('id');let payload;const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));fetch('/api/forms/'+id+'/responses').then(r=>r.json()).then(data=>{payload=data;document.querySelector('#title').textContent=data.form.title;document.querySelector('#count').textContent=`${data.responses.length} ответов`;const root=document.querySelector('#responses');if(!data.responses.length){root.innerHTML='<div class="empty"><div class="empty-icon">◌</div><h2>Ответов пока нет</h2><p class="sub">Поделитесь ссылкой на опубликованную форму.</p></div>';return}root.innerHTML=`<table class="response-table"><thead><tr><th>Дата</th>${data.form.fields.map(f=>`<th>${esc(f.label)}</th>`).join('')}</tr></thead><tbody>${data.responses.map(r=>`<tr><td>${new Date(r.createdAt).toLocaleString('ru')}</td>${data.form.fields.map(f=>`<td>${esc(Array.isArray(r.answers[f.id])?r.answers[f.id].join(', '):r.answers[f.id])}</td>`).join('')}</tr>`).join('')}</tbody></table>`});document.querySelector('#csv').onclick=()=>{if(!payload)return;const rows=[['Дата',...payload.form.fields.map(f=>f.label)],...payload.responses.map(r=>[new Date(r.createdAt).toLocaleString('ru'),...payload.form.fields.map(f=>Array.isArray(r.answers[f.id])?r.answers[f.id].join('; '):(r.answers[f.id]||''))])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='responses.csv';a.click()};</script></body></html>
