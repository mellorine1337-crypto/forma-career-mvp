<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forma — конструктор форм</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/admin">form<i>a</i></a><span class="pill">Админ-панель</span></header><main class="shell"><section class="hero"><div><div class="eyebrow">Формы отклика</div><h1>Найдите своих<br>лучших кандидатов.</h1><p class="sub">Создавайте формы без разработчиков, публикуйте за минуту и следите за конверсией.</p></div><button class="btn" id="newForm">＋ Новая форма</button></section><div id="forms" class="cards"></div></main>
<div class="modal" id="modal"><form class="panel" id="editor"><div class="panel-head"><div><div class="eyebrow">Конструктор</div><h2 id="editorTitle">Новая форма</h2></div><button type="button" class="icon-btn" id="close">×</button></div><input type="hidden" id="formId"><div class="field-group"><label for="title">Название формы</label><input class="input" id="title" required placeholder="Стажировка в команде продукта"></div><div class="field-group"><label for="description">Описание</label><textarea class="input" id="description" placeholder="Расскажите кандидату о следующем шаге"></textarea></div><div class="builder-title"><h3>Вопросы</h3><button type="button" class="btn secondary small" id="addField">＋ Добавить поле</button></div><div id="fields"></div><div class="field-group"><label for="buttonText">Текст кнопки</label><input class="input" id="buttonText" value="Отправить отклик"></div><div class="field-group"><label for="successMessage">Сообщение после отправки</label><input class="input" id="successMessage" value="Спасибо! Ваш отклик отправлен."></div><div class="panel-footer"><button type="button" class="btn secondary" id="cancel">Отмена</button><button class="btn">Сохранить форму</button></div></form></div><div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
